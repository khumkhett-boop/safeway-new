<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SafeWay - Forgot Password</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap 5 & FontAwesome Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
/* ==========================================================
   SafeWay - หน้า Forgot Password (CSS รวมอยู่ในไฟล์นี้)
   ========================================================== */
* { box-sizing: border-box; }

:where(body.safeway-bg) * {
  font-family: 'Prompt', 'Quicksand', sans-serif;
}

body.safeway-bg {
  background-color: #d1e5f7;
  min-height: 100vh;
  padding: 0.5rem !important;
  margin: 0;
}

.lang-switch { font-size: 0.95rem; font-weight: 600; }
.lang-btn { color: #475569; cursor: pointer; transition: color 0.2s ease; }
.lang-btn.active { color: #0f172a; font-weight: 700; }

.safeway-card {
  max-width: 95vw !important;
  width: 100%;
  height: 96vh !important;
  min-height: 650px !important;
  border-radius: 28px !important;
  background-image: url('img/Bg-Desktop.PNG') !important;
  background-size: cover !important;
  background-position: center !important;
  background-repeat: no-repeat !important;
  border: none;
}

.min-vh-card { height: 100% !important; min-height: 100% !important; }

@media (min-width: 992px) {
  .left-branding {
    display: flex !important;
    flex-direction: column !important;
    justify-content: flex-start !important;
    align-items: center !important;
    border-right: 1.5px solid rgba(0, 0, 0, 0.15);
    background: transparent !important;
    padding-top: 5rem !important;
    padding-bottom: 2rem !important;
    height: 100% !important;
  }

  .right-form-panel,
  .right-form-panel.forgot-panel {
    display: flex !important;
    flex-direction: column !important;
    justify-content: center !important;
    align-items: center !important;
    background: transparent !important;
    padding: 2rem !important;
    height: 100% !important;
  }
}

.brand-logo-circle {
  width: 140px !important;
  height: 140px !important;
  min-width: 140px !important;
  min-height: 140px !important;
  background-color: #ffffff !important;
  border-radius: 50% !important;
  overflow: hidden !important;
  display: flex !important;
  align-items: center !important;
  justify-content: center !important;
  padding: 14px !important;
  box-shadow: 0 6px 16px rgba(0, 0, 0, 0.08) !important;
}
.brand-logo-circle img { max-height: 100%; object-fit: contain; }

.brand-title {
  font-size: 2.8rem !important;
  font-weight: 700 !important;
  letter-spacing: 1.5px !important;
  color: #000000 !important;
}
.brand-subtitle { font-size: 1.15rem !important; color: #1e293b !important; }

.brand-title-mobile { font-size: 2rem !important; letter-spacing: 1px !important; }
.brand-subtitle-mobile { font-size: 0.95rem !important; }

.form-wrapper { max-width: 440px; width: 100%; margin: 0 auto; }

.welcome-heading {
  font-size: 2.2rem !important;
  font-weight: 700 !important;
  color: #0f172a !important;
  line-height: 1.25 !important;
}
.welcome-subtext {
  font-size: 0.95rem !important;
  color: #475569 !important;
  line-height: 1.6 !important;
}

/* วงกลมจดหมาย (Reset Link Sent) */
.mail-circle-icon {
  width: 130px;
  height: 130px;
  border-radius: 50%;
  background-color: #0f2b7b;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 8px 24px rgba(15, 43, 123, 0.3);
  transition: all 0.3s ease;
}
.mail-circle-icon i { font-size: 3.2rem; color: #ffffff; }

.safeway-input {
  background-color: #ffffff !important;
  border: 1px solid #e2e8f0;
  border-radius: 35px;
  padding-top: 14px;
  padding-bottom: 14px;
  font-size: 0.95rem;
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.03);
}
.safeway-input:focus {
  border-color: #0f2b7b;
  box-shadow: 0 0 0 0.25rem rgba(15, 43, 123, 0.15);
}

.input-icon { font-size: 1.05rem; cursor: pointer; z-index: 5; }

.btn-safeway-primary {
  background-color: #0f2b7b !important;
  border: none;
  font-size: 1.05rem;
  letter-spacing: 0.5px;
  box-shadow: 0 4px 14px rgba(15, 43, 123, 0.35);
  transition: all 0.2s ease;
}
.btn-safeway-primary:hover { background-color: #081b52 !important; transform: translateY(-2px); }

/* Tablet & Mobile */
@media (max-width: 991.98px) {
  body.safeway-bg { padding: 0.75rem !important; }

  .safeway-card {
    max-width: 100% !important;
    width: 100% !important;
    height: auto !important;
    min-height: 92vh !important;
    margin: 0 auto;
    border-radius: 28px !important;
  }

  .left-branding { display: none !important; }

  .right-form-panel,
  .right-form-panel.forgot-panel {
    width: 100% !important;
    max-width: 100% !important;
    flex: 0 0 100% !important;
    display: flex !important;
    flex-direction: column !important;
    justify-content: center !important;
    align-items: center !important;
    padding: 2rem 1.5rem !important;
    margin: 0 auto !important;
    min-height: 85vh !important;
  }

  .form-wrapper { max-width: 500px !important; width: 100% !important; margin: 0 auto !important; }
  .forgot-content-box { margin-top: 0 !important; }
  .welcome-heading { font-size: 2rem !important; }

  .mail-circle-icon { width: 120px; height: 120px; }
  .mail-circle-icon i { font-size: 2.8rem; }
}

@media (max-width: 575.98px) {
  .right-form-panel,
  .right-form-panel.forgot-panel { padding: 1.5rem 1rem !important; }

  .form-wrapper { max-width: 100% !important; }

  .brand-logo-circle,
  .mail-circle-icon {
    width: 95px !important;
    height: 95px !important;
    min-width: 95px !important;
    min-height: 95px !important;
    padding: 10px !important;
  }

  .mail-circle-icon i { font-size: 2.2rem; }
  .brand-title-mobile { font-size: 1.75rem !important; }
  .welcome-heading { font-size: 1.65rem !important; }

  .safeway-input,
  .btn-safeway-primary {
    padding-top: 11px !important;
    padding-bottom: 11px !important;
    font-size: 0.9rem;
  }
}

@media (max-width: 767.98px) {
  .safeway-card { background-image: url('img/Bg-Mobile.JPG') !important; }
}

/* iPad Pro 13 แนวตั้ง (992px - 1100px) ให้เหมือน iPad Mini */
@media (min-width: 992px) and (max-width: 1100px) and (orientation: portrait) {
  body.safeway-bg { padding: 0.75rem !important; }

  .safeway-card {
    max-width: 100% !important;
    width: 100% !important;
    height: auto !important;
    min-height: 92vh !important;
    margin: 0 auto;
    border-radius: 28px !important;
  }

  .left-branding { display: none !important; }

  .d-lg-none:has(.brand-title-mobile) {
    display: flex !important;
    flex-direction: column !important;
    align-items: center !important;
    text-align: center !important;
  }

  .right-form-panel.forgot-panel {
    width: 100% !important;
    max-width: 100% !important;
    flex: 0 0 100% !important;
    height: auto !important;
    justify-content: center !important;
    align-items: center !important;
    padding: 2rem 1.5rem !important;
    margin: 0 auto !important;
    min-height: 85vh !important;
  }

  .form-wrapper { max-width: 540px !important; width: 100% !important; margin: 0 auto !important; }
  .forgot-content-box { margin-top: 0 !important; }

  .brand-logo-circle {
    width: 220px !important;
    height: 220px !important;
    min-width: 220px !important;
    min-height: 220px !important;
    padding: 22px !important;
  }

  .brand-title-mobile { font-size: 3rem !important; }
  .brand-subtitle-mobile { font-size: 1.2rem !important; }
  .welcome-heading { font-size: 2.4rem !important; }
  .welcome-subtext { font-size: 1rem !important; }

  .safeway-input { padding-top: 18px; padding-bottom: 18px; font-size: 1.1rem; }

  .btn-safeway-primary {
    padding-top: 1.2rem !important;
    padding-bottom: 1.2rem !important;
    font-size: 1.1rem !important;
  }

  .mail-circle-icon { width: 150px; height: 150px; }
  .mail-circle-icon i { font-size: 3.4rem; }
}
    </style>
  </head>
  <body class="safeway-bg d-flex align-items-center justify-content-center">

    <!-- Card ใหญ่ SafeWay -->
    <div class="safeway-card shadow-lg position-relative overflow-hidden w-100">

      <!-- ปุ่มสลับภาษา TH / EN -->
      <div class="lang-switch position-absolute top-0 end-0 p-3 p-md-4 z-3">
        <span class="lang-btn" id="btn-th" onclick="switchLang('th')">TH</span>
        <span class="text-secondary mx-1">/</span>
        <span class="lang-btn active" id="btn-en" onclick="switchLang('en')">EN</span>
      </div>

      <div class="row g-0 h-100 min-vh-card justify-content-center">

        <!-- ฝั่งซ้าย: โลโก้ SafeWay (แสดงเฉพาะ Desktop) -->
        <div class="col-lg-6 d-none d-lg-flex flex-column align-items-center justify-content-center text-center p-4 p-md-5 left-branding position-relative">
          <div class="brand-logo-circle mb-3 shadow-sm">
            <img src="img/logo.png" alt="SafeWay Logo" class="img-fluid" onerror="this.onerror=null; this.src='https://cdn-icons-png.flaticon.com/512/854/854878.png';">
          </div>
          <h1 class="brand-title fw-bold text-dark mb-1">SAFEWAY</h1>
          <p class="brand-subtitle text-secondary fw-semibold mb-0">Walk Home Safe</p>
        </div>

        <!-- ฝั่งขวา: Panel กรอกอีเมล / แสดงผลส่งรีเซ็ต -->
        <div class="col-lg-6 col-12 d-flex flex-column align-items-center justify-content-center p-4 p-md-5 right-form-panel forgot-panel">

          <div class="w-100 form-wrapper text-center mx-auto">

            <!-- STATE 1: ฟอร์มกรอก Forgot Password -->
            <div class="w-100 forgot-content-box" id="state-forgot">

              <!-- โลโก้ด้านบน (แสดงเฉพาะ Tablet / Mobile) -->
              <div class="d-lg-none d-flex flex-column align-items-center justify-content-center text-center mb-3">
                <div class="brand-logo-circle mb-3 shadow-sm">
                  <img src="img/logo.png" alt="SafeWay Logo" class="img-fluid" onerror="this.onerror=null; this.src='https://cdn-icons-png.flaticon.com/512/854/854878.png';">
                </div>
                <h2 class="brand-title-mobile fw-bold text-dark mb-1">SAFEWAY</h2>
                <p class="brand-subtitle-mobile text-secondary fw-semibold mb-0">Walk Home Safe</p>
              </div>

              <div class="mb-4">
                <h2 class="welcome-heading fw-bold text-dark mb-2" id="txt-forgot-title">Forgot Password</h2>
                <p class="welcome-subtext text-muted small mb-0 lh-base" id="txt-forgot-sub">
                  Please enter your email or phone number. We will send you<br>a reset link.
                </p>
              </div>

              <form id="forgotForm" onsubmit="handleSendReset(event)">
                <div class="mb-4 position-relative text-start">
                  <span class="input-icon position-absolute top-50 start-0 translate-middle-y ms-3 text-muted">
                    <i class="fa-regular fa-envelope"></i>
                  </span>
                  <input type="email" class="form-control safeway-input ps-5" id="reset-email" placeholder="Email / Phone number" required>
                </div>

                <button type="submit" class="btn btn-safeway-primary w-100 py-3 fw-bold text-white rounded-pill mb-3 fs-6" id="btn-send-reset">
                  Send Reset Link
                </button>

                <div>
                  <a href="index.html" class="text-decoration-none text-muted small fw-semibold" id="txt-back-login">Back to Login</a>
                </div>
              </form>
            </div>

            <!-- STATE 2: หน้าแจ้งเตือน Reset Link Sent -->
            <div class="w-100 d-none forgot-content-box sent-state-box" id="state-sent">

              <div class="mail-circle-icon shadow-sm mx-auto">
                <i class="fa-regular fa-envelope"></i>
              </div>

              <h2 class="welcome-heading fw-bold text-dark mb-3 mt-4" id="txt-sent-title">Reset Link Sent</h2>

              <div class="welcome-subtext text-muted mb-4 lh-base">
                <span id="txt-sent-sub1">We have sent a password reset link to</span><br>
                <strong class="text-secondary fw-semibold" id="user-target-email">Mewwy_24@gmail.com</strong><br>
                <span id="txt-sent-sub2">Please check your email.</span>
              </div>

              <a href="reset-password.html" class="btn btn-safeway-primary w-100 py-3 fw-bold text-white rounded-pill mb-4 fs-6 text-decoration-none d-block" id="btn-done">
                Done
              </a>

              <div class="text-muted small">
                <span id="txt-resend-prompt">Didn't receive the email?</span>
                <button type="button" class="btn btn-link p-0 text-decoration-none small text-muted fw-semibold ms-1" id="btn-resend" onclick="resendEmail()" disabled>
                  Resend (<span id="timer-count">00:59</span>)
                </button>
              </div>

            </div>

          </div>

        </div>

      </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Firebase SDK & Logic -->
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
      import { getAuth, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

      const firebaseConfig = {
        apiKey: "AIzaSyC6mi8yTlO7lSk2-GnAPlikS29SRM-0EFk",
        authDomain: "safeway-7c648.firebaseapp.com",
        projectId: "safeway-7c648",
        storageBucket: "safeway-7c648.firebasestorage.app",
        messagingSenderId: "193164409149",
        appId: "1:193164409149:web:c9c40686de0ab0218a6d54",
        measurementId: "G-CCY77DPF18"
      };

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);

      let countdownTimer = null;
      let targetEmail = "";

      window.handleSendReset = function(e) {
        e.preventDefault();
        const emailInput = document.getElementById('reset-email').value;
        targetEmail = emailInput;

        sendPasswordResetEmail(auth, emailInput)
          .then(() => { showSentState(); })
          .catch((error) => {
            console.warn("Firebase Notice:", error.message);
            showSentState();
          });
      };

      function showSentState() {
        document.getElementById('state-forgot').classList.add('d-none');
        document.getElementById('state-sent').classList.remove('d-none');
        document.getElementById('user-target-email').innerText = targetEmail;
        startResendTimer();
      }

      function startResendTimer() {
        let timeLeft = 59;
        const resendBtn = document.getElementById('btn-resend');
        const timerSpan = document.getElementById('timer-count');

        resendBtn.disabled = true;
        if (countdownTimer) clearInterval(countdownTimer);

        countdownTimer = setInterval(() => {
          timeLeft--;
          const sec = timeLeft < 10 ? `0${timeLeft}` : timeLeft;
          timerSpan.innerText = `00:${sec}`;

          if (timeLeft <= 0) {
            clearInterval(countdownTimer);
            resendBtn.disabled = false;
            timerSpan.innerText = "Click here";
          }
        }, 1000);
      }

      window.resendEmail = function() {
        if (targetEmail) {
          sendPasswordResetEmail(auth, targetEmail).catch(() => {});
          alert("ส่งลิงก์รีเซ็ตรหัสผ่านอีกครั้งเรียบร้อยแล้ว!");
          startResendTimer();
        }
      };

      const langData = {
        en: {
          forgotTitle: "Forgot Password",
          forgotSub: "Please enter your email or phone number. We will send you<br>a reset link.",
          emailPlaceholder: "Email / Phone number",
          btnSend: "Send Reset Link",
          backLogin: "Back to Login",
          sentTitle: "Reset Link Sent",
          sentSub1: "We have sent a password reset link to",
          sentSub2: "Please check your email.",
          btnDone: "Done",
          resendPrompt: "Didn't receive the email?"
        },
        th: {
          forgotTitle: "ลืมรหัสผ่าน",
          forgotSub: "กรุณากรอกอีเมลหรือเบอร์โทรศัพท์ของคุณ เราจะส่งลิงก์<br>สำหรับตั้งรหัสผ่านใหม่ไปให้",
          emailPlaceholder: "อีเมล / เบอร์โทรศัพท์",
          btnSend: "ส่งลิงก์รีเซ็ตรหัสผ่าน",
          backLogin: "กลับไปยังหน้าเข้าสู่ระบบ",
          sentTitle: "ส่งลิงก์รีเซ็ตเรียบร้อยแล้ว",
          sentSub1: "เราได้ส่งลิงก์สำหรับตั้งรหัสผ่านใหม่ไปที่",
          sentSub2: "กรุณาตรวจสอบกล่องข้อความในอีเมลของคุณ",
          btnDone: "เสร็จสิ้น",
          resendPrompt: "ไม่ได้รับอีเมลใช่ไหม?"
        }
      };

      window.switchLang = function(lang) {
        document.getElementById('btn-th').classList.toggle('active', lang === 'th');
        document.getElementById('btn-en').classList.toggle('active', lang === 'en');

        document.getElementById('txt-forgot-title').innerText = langData[lang].forgotTitle;
        document.getElementById('txt-forgot-sub').innerHTML = langData[lang].forgotSub;
        document.getElementById('reset-email').placeholder = langData[lang].emailPlaceholder;
        document.getElementById('btn-send-reset').innerText = langData[lang].btnSend;
        document.getElementById('txt-back-login').innerText = langData[lang].backLogin;

        document.getElementById('txt-sent-title').innerText = langData[lang].sentTitle;
        document.getElementById('txt-sent-sub1').innerText = langData[lang].sentSub1;
        document.getElementById('txt-sent-sub2').innerText = langData[lang].sentSub2;
        document.getElementById('btn-done').innerText = langData[lang].btnDone;
        document.getElementById('txt-resend-prompt').innerText = langData[lang].resendPrompt;
      };

      switchLang('th');
    </script>
  </body>
</html>
